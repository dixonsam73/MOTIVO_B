# Supabase CLI configuration.
#
# This file exists for one reason: `supabase functions deploy` defaults
# verify_jwt to TRUE when no config entry exists, and delete_account_v1 is
# deployed with it FALSE. Without this file, the next deploy from a clean
# checkout would silently change the deployed authorisation configuration of
# the most irreversible path in the system — exactly the class of drift that
# B-17 and supabase/README.md exist to prevent.
#
# Deliberately minimal. The CLI merges defaults for everything it does not
# find here, so sections for db, auth, storage and studio would be
# configuration nobody applies.
#
# CORRECTED 2026-08-20. This header used to say "nothing in this project runs a
# local instance: there is no `supabase start`, no `db reset`, and no migrations
# until Phase 3." All three became false at U1: there is a local stack, `db
# reset --local` is the routine way to rebuild it, and `supabase/migrations/`
# is now the reproducible source B-23 required. Left uncorrected it would have
# read as licence to ignore the migration history.

project_id = "rlwtqxumfobakvdueugm"

[functions.revoke_apple_identity_v1]
# C-44 — Sign in with Apple revocation at account-deletion time.
#
# verify_jwt = false mirrors delete_account_v1 rather than being stricter than
# it, deliberately: this function performs its own auth.getUser(token) and
# derives the caller from the verified token, never from the request body, and
# both destructive-path functions should have ONE authorisation story rather
# than two. It also binds the exchanged Apple `sub` to that verified caller's
# Apple provider identity before revoking anything, so it cannot be aimed at a
# third party's authorization.
verify_jwt = false

[functions.delete_account_v1]
# verify_jwt = false is NOT a relaxation. The function performs its own check
# and it is stricter than the gateway's: it calls auth.getUser(token) and
# derives the subject from the verified token, never from the request body,
# so the account being deleted is always the caller's own. Confirmed as the
# deployed state (`supabase functions list` reports verify_jwt: false).
verify_jwt = false

[functions.appstore_notifications_v1]
# App Store Server Notifications V2 ingestion.
#
# verify_jwt = false IS A DIFFERENT STATEMENT HERE FROM THE TWO BLOCKS ABOVE,
# and reading it as the same one is the mistake this comment exists to prevent.
# Those two set it false and then perform their OWN auth.getUser(token), which
# is stricter than the gateway. THIS FUNCTION HAS NO TOKEN TO CHECK: Apple sends
# no Supabase JWT and never will, so the endpoint is genuinely unauthenticated
# and the Apple JWS signature — x5c chain verified against a pinned, embedded
# Apple Root CA G3 — is the entire authorisation story.
#
# verify_jwt = true is not an option: it would reject every notification Apple
# sends. The compensating controls are B-29's three tiers, so that an
# unauthenticated caller cannot obtain an unbounded durable write.
verify_jwt = false

[functions.appstore_reconcile_v1]
# Authoritative App Store Server API reads.
#
# verify_jwt = false and then an explicit constant-time comparison against the
# service role key. NOTE WHAT verify_jwt = true WOULD NOT HAVE GIVEN US: any
# valid user JWT satisfies the gateway, and every authenticated Apple user can
# obtain one — so the gateway check would have been strictly weaker than the one
# performed inside. Same authorisation story as the other three functions:
# derived from what the caller proves, never from the request body.
verify_jwt = false
